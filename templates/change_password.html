<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSDAC Change Password</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --navy: #263353;
    --navy2: #101a2e;
    --red: #ff3b3b;
    --amber: #ffb020;
    --green: #2ee6a6;
    --ink: #e8edf7;
    --muted: #7d8aa8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,59,59,0.02), transparent 40%),
      radial-gradient(circle at 85% 15%, rgba(255,176,32,0.02), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(46,230,166,0.02), transparent 45%),
      var(--navy);
    font-family: 'Space Grotesk', sans-serif;
    color: var(--ink);
    overflow: hidden;
    position: relative;
    padding: 1rem;
  }

  .track {
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0 38px,
      rgba(125,138,168,0.08) 38px 40px
    );
    animation: drift 6s linear infinite;
  }
  @keyframes drift { from { background-position: 0 0; } to { background-position: 0 40px; } }

  .card {
    position: relative;
    z-index: 2;
    width: min(380px, 100%);
    background: linear-gradient(180deg, var(--navy2), #0c1526);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 18px;
    padding: 38px 34px 30px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.6),
      0 0 0 1px rgba(255,255,255,0.02);
    box-sizing: border-box;
  }

  .signals {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 18px;
  }
  .lamp { width: 14px; height: 14px; border-radius: 50%; }
  .lamp.red { background: var(--red); box-shadow: 0 0 14px 3px rgba(255,59,59,0.7); }
  .lamp.amber { background: var(--amber); box-shadow: 0 0 14px 3px rgba(255,176,32,0.7); animation: blink 1.6s ease-in-out infinite; }
  .lamp.green { background: var(--green); box-shadow: 0 0 14px 3px rgba(46,230,166,0.7); }
  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.25; } }

  h1 { text-align: center; font-size: 22px; font-weight: 700; margin: 0 0 4px; letter-spacing: 0.3px; }
  .sub { text-align: center; color: var(--muted); font-size: 12.5px; margin: 0 0 24px; font-family: 'JetBrains Mono', monospace; }

  label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin: 0 0 6px; font-weight: 500; }
  form { width: 100%; }
  .field { margin-bottom: 18px; }

  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.03);
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    box-sizing: border-box;
  }
  input::placeholder { color: #4d5a78; }
  input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(46,230,166,0.15); }

  .error-msg { color: var(--red); text-align: center; font-size: 13px; margin: 0 0 1rem; font-family: 'JetBrains Mono', monospace; }
  .success-msg { color: var(--green); text-align: center; font-size: 13px; margin: 0 0 1rem; font-family: 'JetBrains Mono', monospace; }

  .show-hide-btn {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: #e2e8f0; border: none; border-radius: 4px; color: #000000;
    font-size: 0.7rem; font-weight: 500; cursor: pointer; padding: 4px 8px;
    font-family: 'Space Grotesk', sans-serif;
  }

  nav { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-top: 6px; }
  nav a {
    flex: 1; text-align: center; text-decoration: none;
    border: 1px solid rgba(255,255,255,0.15); color: var(--ink);
    border-radius: 10px; padding: 12px; font-size: 13px; font-family: 'Space Grotesk', sans-serif;
  }
  nav a:hover { background: rgba(255,255,255,0.05); }

  button[type="submit"] {
    flex: 1; padding: 13px; border: none; border-radius: 10px;
    font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13px;
    letter-spacing: 0.3px; color: #0b1220;
    background: linear-gradient(90deg, var(--red), var(--amber), var(--green));
    background-size: 200% 100%; cursor: pointer;
    transition: background-position 0.4s, transform 0.15s; box-sizing: border-box;
  }
  button[type="submit"]:hover { background-position: 100% 0; transform: translateY(-1px); }
</style>
</head>
<body>
  <div class="track"></div>
  <div class="card">
    <div class="signals">
      <span class="lamp red"></span>
      <span class="lamp amber"></span>
      <span class="lamp green"></span>
    </div>
    <h1>Change Password</h1>
    <p class="sub">Applies immediately - no admin approval needed.</p>

    {% if error %}
    <p class="error-msg">{{ error }}</p>
    {% endif %}
    {% if message %}
    <p class="success-msg">{{ message }}</p>
    {% endif %}

    <form action="/change-password" method="post">
      <div class="field">
        <label for="current_password">Current Password</label>
        <div style="position:relative;">
          <input type="password" name="current_password" id="current_password" required placeholder="Current password" style="padding-right:3.4rem;">
          <button type="button" class="show-hide-btn" onclick="var p=document.getElementById('current_password'); var isPwd=p.type==='password'; p.type=isPwd?'text':'password'; this.textContent=isPwd?'Hide':'Show';">Show</button>
        </div>
      </div>
      <div class="field">
        <label for="new_password">New Password</label>
        <div style="position:relative;">
          <input type="password" name="new_password" id="new_password" required placeholder="New password" style="padding-right:3.4rem;">
          <button type="button" class="show-hide-btn" onclick="var p=document.getElementById('new_password'); var isPwd=p.type==='password'; p.type=isPwd?'text':'password'; this.textContent=isPwd?'Hide':'Show';">Show</button>
        </div>
      </div>
      <div class="field">
        <label for="confirm_new_password">Confirm New Password</label>
        <div style="position:relative;">
          <input type="password" name="confirm_new_password" id="confirm_new_password" required placeholder="Re-enter new password" style="padding-right:3.4rem;">
          <button type="button" class="show-hide-btn" onclick="var p=document.getElementById('confirm_new_password'); var isPwd=p.type==='password'; p.type=isPwd?'text':'password'; this.textContent=isPwd?'Hide':'Show';">Show</button>
        </div>
      </div>
      <nav>
        <a href="/">Back to tool</a>
        <button type="submit">Change Password</button>
      </nav>
    </form>
  </div>
  <script>
    document.querySelector('form').addEventListener('submit', function(e) {
      var newPw = document.getElementById('new_password').value;
      var confirmPw = document.getElementById('confirm_new_password').value;
      if (newPw !== confirmPw) {
        e.preventDefault();
        alert("New password and confirmation don't match.");
      }
    });
  </script>
</body>
</html>
